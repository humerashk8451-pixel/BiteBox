<h2>Customer Registration & Order Form</h2>
  
<hr>
<form action="">
<h3>Customer Information</h3>


<label for="fullname">Full name</label>
<br>
<input type="text" id="fullname" name="fulname">
<br><br>


<label for="email">Email Address</label>
<br>
<input type="email" id="email" name="email">
<br><br>
 
<label for="password">Password</label>
<br>
<input type="password" id="password" name="password">
<br><br>
 
<label for="phone">Phone Number</label>
<br>
<input type="tel" id="phone" name="phone">
<br><br>

<h3>Order Information</h3>
<label for="quantity">Quantity</label>

<br>

<input type="number"
id="quantity"
name="quantity">

<br><br>

<label for="deliveryDate">
 
Preferred Delivery Date
 
</label>
 
<br>
 
<input
type="date"
id="deliveryDate"
name="deliveryDate">
 
<br><br>

<label for="food"> Select food item </label>
<br>
<select name="food" id="food">
<option value="">Veg pizza</option>
<option value="">cheese burger</option>
<option>White Sauce Pasta</option>
<option>Veg Grilled Sandwich</option>
<option>Chocolate Brownie</option>
</select>

<br><br>

<h3>Payment Method</h3>
<input type="radio" name="payment" id="cash">
<label for="cash">Cash</label>
<br>

<input type="radio" name="payment" id="card">
<label for="card">Card</label>
<br>

<input type="radio" name="payment" id="upi">
<label for="upi">UPI</label>

<br><br>

<h3>Extras</h3>
<input type="checkbox" id="cheese" name="extras">
<label for="cheese">extra cheese</label>
<br>

<input type="checkbox" id="drink" name="extras">
<label for="drink"> Cold Drink </label>
<br>
 
<input type="checkbox" id="dessert" name="extras">
<label for="dessert"> Dessert </label>
<br><br>

<h3>Delivery Instructions </h3>
 
<label for="address">
 
Delivery Address
 
</label>
 
<br>
 
<textarea id="address" name="address" rows="5" cols="40">
</textarea>

  <br><br>

<input type="submit" value="Place Order">
 
<input type="reset" value="Clear Form">

<br><br>

</form>

</body>
</html>
